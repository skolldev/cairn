name: CI

# Every push gets its own complete run: no pull_request duplicate, no cancelling.
on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Only cairn-app may depend on GPUI. The dependency graph is resolved for every target,
  # so one OS is enough. The self-test shows the check fails on deliberate violations.
  gpui-free:
    name: GPUI-free crates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Guard self-test (deliberate violations must fail)
        run: ./scripts/test-check-gpui-free.sh
      - name: Every crate except cairn-app is GPUI-free
        run: ./scripts/check-gpui-free.sh

  # Only cairn-write's runner may start processes, so every git call gets its rules. A
  # source scan, so one OS is enough. The self-test shows it fails on deliberate violations.
  single-git-spawn:
    name: git spawned only by cairn-write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Guard self-test (deliberate violations must fail)
        run: ./scripts/test-check-single-git-spawn.sh
      - name: Only cairn-write starts processes
        run: ./scripts/check-single-git-spawn.sh

  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache the small fixture
        uses: actions/cache@v4
        with:
          path: ~/cairn-fixtures/ripgrep
          key: fixture-ripgrep-91f5d22ef48bde459d90a8c7dbeab416e97d0f2b-${{ runner.os }}
      - name: Small fixture
        shell: bash
        run: ./scripts/fixtures.sh small
      # Built locally in well under a second, so it isn't cached.
      - name: autocrlf and filters fixture
        shell: bash
        run: ./scripts/fixtures.sh filters
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked --no-fail-fast

  # The oldest supported git is a tested claim: every test that runs git runs against
  # git 2.23 itself. Linux, because building an old git from source is quickest there; the
  # runner's resolution there is simply the first git on PATH.
  oldest-git:
    name: git tests against git 2.23
    runs-on: ubuntu-latest
    env:
      GIT_VERSION: 2.23.0
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache git ${{ env.GIT_VERSION }}
        uses: actions/cache@v4
        with:
          path: ~/git-${{ env.GIT_VERSION }}
          key: git-${{ env.GIT_VERSION }}-${{ runner.os }}-${{ hashFiles('scripts/oldest-git.sh') }}
      # Made with the runner's own git, before 2.23 goes on PATH: 2.23 is built without
      # curl, so it can't clone the small fixture over HTTPS.
      - name: Cache the small fixture
        uses: actions/cache@v4
        with:
          path: ~/cairn-fixtures/ripgrep
          key: fixture-ripgrep-91f5d22ef48bde459d90a8c7dbeab416e97d0f2b-${{ runner.os }}
      - name: Fixtures
        run: |
          ./scripts/fixtures.sh small
          ./scripts/fixtures.sh filters
      - name: Build git ${{ env.GIT_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libz-dev
          ./scripts/oldest-git.sh "$GIT_VERSION" "$HOME/git-$GIT_VERSION" >> "$GITHUB_PATH"
      # Every crate whose tests run git: the runner itself, and the Repo service's reads.
      - name: runner and Repo service tests
        env:
          CAIRN_EXPECT_GIT_VERSION: ${{ env.GIT_VERSION }}
        run: |
          git --version
          cargo test -p cairn-write -p cairn-repo --locked --no-fail-fast
