name: CI

# Every push gets its own complete run: no pull_request duplicate, no cancelling.
on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Only cairn-app may depend on GPUI. The dependency graph is resolved for every target,
  # so one OS is enough. The self-test shows the check fails on deliberate violations.
  gpui-free:
    name: GPUI-free crates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Guard self-test (deliberate violations must fail)
        run: ./scripts/test-check-gpui-free.sh
      - name: Every crate except cairn-app is GPUI-free
        run: ./scripts/check-gpui-free.sh

  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache the small fixture
        uses: actions/cache@v4
        with:
          path: ~/cairn-fixtures/ripgrep
          key: fixture-ripgrep-91f5d22ef48bde459d90a8c7dbeab416e97d0f2b-${{ runner.os }}
      - name: Small fixture
        shell: bash
        run: ./scripts/fixtures.sh small
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
