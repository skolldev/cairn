name: CI

# Every push gets its own complete run: no pull_request duplicate, no cancelling.
on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Only cairn-app may depend on GPUI. The dependency graph is resolved for every target,
  # so one OS is enough. The self-test shows the check fails on deliberate violations.
  gpui-free:
    name: GPUI-free crates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Guard self-test (deliberate violations must fail)
        run: ./scripts/test-check-gpui-free.sh
      - name: Every crate except cairn-app is GPUI-free
        run: ./scripts/check-gpui-free.sh

  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache the small fixture
        uses: actions/cache@v4
        with:
          path: ~/cairn-fixtures/ripgrep
          key: fixture-ripgrep-91f5d22ef48bde459d90a8c7dbeab416e97d0f2b-${{ runner.os }}
      - name: Small fixture
        shell: bash
        run: ./scripts/fixtures.sh small
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  # The oldest supported git is a tested claim: the runner tests run against git 2.23
  # itself. Linux, because building an old git from source is quickest there; the
  # runner's resolution there is simply the first git on PATH.
  oldest-git:
    name: runner tests against git 2.23
    runs-on: ubuntu-latest
    env:
      GIT_VERSION: 2.23.0
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache git ${{ env.GIT_VERSION }}
        id: git-cache
        uses: actions/cache@v4
        with:
          path: ~/git-${{ env.GIT_VERSION }}
          key: git-${{ env.GIT_VERSION }}-${{ runner.os }}-v2
      - name: Build git ${{ env.GIT_VERSION }}
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libz-dev
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_VERSION.tar.gz" | tar xz
          cd "git-$GIT_VERSION"
          # Current gcc defaults to C23, where thread_local is a keyword git 2.23 uses as a
          # name, and rejects some pre-C99 idioms outright. Build it as the C it was written in.
          make -j"$(nproc)" prefix="$HOME/git-$GIT_VERSION" CFLAGS="-O2 -std=gnu11 -fpermissive" \
            NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 NO_CURL=1 NO_EXPAT=1 NO_OPENSSL=1 \
            install
      - name: Put git ${{ env.GIT_VERSION }} first on PATH
        run: echo "$HOME/git-$GIT_VERSION/bin" >> "$GITHUB_PATH"
      - name: runner tests
        env:
          CAIRN_EXPECT_GIT_VERSION: ${{ env.GIT_VERSION }}
        run: |
          git --version
          cargo test -p cairn-write --locked
