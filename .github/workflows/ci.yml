name: CI

# THROWAWAY: probes for a transient read failure, on Windows only. Never to be merged.
on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  probe:
    name: read failure probes (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Defender and git
        shell: pwsh
        run: |
          git --version
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AMRunningMode | Format-List
      - name: Build
        run: cargo test -p cairn-repo --test probe_sticky --test probe_stress --locked --no-run
      - name: Sticky
        run: cargo test -p cairn-repo --test probe_sticky --locked -- --nocapture --test-threads=1
      - name: Stress
        if: ${{ always() }}
        run: cargo test -p cairn-repo --test probe_stress --locked -- --nocapture --test-threads=1
