[package]
name = "cairn-app"
description = "The Cairn GPUI binary. The only crate allowed to depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[features]
# The Budget harness's probe: what each frame painted and when it reached the screen. Never in a
# build that ships. `scripts/budget.sh` builds with it. See docs/budget-harness.md.
measure = ["dep:cairn-budget", "dep:block2"]

[dependencies]
cairn-budget = { workspace = true, optional = true }
cairn-core.workspace = true
cairn-read.workspace = true
cairn-write.workspace = true
cairn-graph.workspace = true
cairn-diff.workspace = true
cairn-auth.workspace = true
cairn-repo.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
objc2.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
